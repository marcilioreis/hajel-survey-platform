<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var path = window.location.pathname;

      if (path !== '/' && !path.match(/\.[a-zA-Z0-9]+$/)) {
        var testEl = document.createElement('div');
        testEl.style.display = 'none';
        document.head.appendChild(testEl);
        var style = window.getComputedStyle(testEl);
        if (!style) {
          history.replaceState(null, '', path.replace(/\/+$/, '') + '/index.html');
          window.location.reload();
        }
        document.head.removeChild(testEl);
      }
    })();
  </script>
  <link href="/src/style.css" rel="stylesheet">
  <title>Retrato - Pesquisas de Opinião</title>
</head>

<body>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(
          (registration) => {
            console.log('SW registrado: ', registration.scope);
          },
          (err) => {
            console.log('Falha no registro do SW: ', err);
          }
        );
      });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
